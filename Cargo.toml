[package]
name = "agentring"
version = "0.1.0"
edition = "2021"
description = "Cross-platform menu-bar app that remaps a Bluetooth finger-ring into keyboard shortcuts"
license = "MIT"
repository = "https://github.com/smashah/agentring"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.2"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[lib]
name = "agentring"
path = "src/lib.rs"

[[bin]]
name = "agentring"
path = "src/main.rs"
